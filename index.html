<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OUTLAW: LAST FRONTIER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a17;color:#f1f4ed;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block}
.panel{background:rgba(9,15,15,.82);border:1px solid rgba(180,205,177,.24);border-radius:12px;backdrop-filter:blur(8px);padding:10px}
#stats{position:absolute;top:10px;left:10px;width:min(66vw,310px);font-size:12px;line-height:1.45;pointer-events:none}
.brand{font-weight:900;letter-spacing:1.6px;font-size:15px;color:#d7b56d}
.muted{color:#a9b8ad}.bar{height:6px;background:#35423b;border-radius:9px;overflow:hidden;margin:3px 0 5px}.fill{height:100%;background:#86b96d;width:100%}
#menu{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-direction:column}
button{font:700 12px system-ui;border:1px solid #65766a;color:#f3f5ee;background:rgba(20,31,27,.9);padding:11px 12px;border-radius:10px;min-height:40px}
button:active{background:#617b5c}#controls{position:absolute;inset:auto 0 14px;height:180px;pointer-events:none}
#stick{position:absolute;left:18px;bottom:12px;width:140px;height:140px;border-radius:50%;background:#b5c7b322;border:1px solid #b5c7b355;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:42px;top:42px;width:54px;height:54px;border-radius:50%;background:#d4e2d577;border:1px solid #e1eee2aa}
#actions{position:absolute;right:14px;bottom:8px;display:grid;grid-template-columns:repeat(2,76px);gap:8px;pointer-events:auto}
#actions button{height:54px;font-size:11px}
#notice{position:absolute;left:50%;top:22%;transform:translateX(-50%);max-width:85%;text-align:center;white-space:normal}
#bottom{position:absolute;bottom:202px;left:50%;transform:translateX(-50%);font-size:11px;color:#e7eee3;text-align:center;width:80%;pointer-events:none}
#modal{display:none;position:absolute;inset:7% 5%;overflow:auto;background:#111c18f5;border:1px solid #72816d;border-radius:16px;padding:16px;z-index:4}
#modal h2{margin:0 0 10px;font-size:19px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff18;font-size:13px}
#modal .close{float:right}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(min-width:700px){#stats{font-size:14px;width:340px}#controls{height:200px}#stick{width:160px;height:160px}#knob{left:51px;top:51px}#actions{grid-template-columns:repeat(2,100px)}}
</style>
</head>
<body>
<div id="game"></div>
<div id="stats" class="panel"><div class="brand">OUTLAW: LAST FRONTIER</div><div id="statlines">Loading frontier…</div></div>
<div id="menu"><button onclick="openMenu('Character')">CHARACTER</button><button onclick="openMenu('Inventory')">INVENTORY</button><button onclick="openMenu('Jobs & Training')">JOBS / TRAIN</button><button onclick="saveGame()">SAVE</button></div>
<div id="notice" class="panel" style="display:none"></div>
<div id="bottom">Explore • Gather supplies • Earn cash • Build your stats</div>
<div id="controls"><div id="stick"><div id="knob"></div></div><div id="actions">
<button onclick="interact()">GATHER / USE</button><button onclick="attack()">ATTACK</button>
<button onclick="jump()">JUMP</button><button onclick="eat()">EAT FOOD</button>
</div></div>
<div id="modal" class="panel"><button class="close" onclick="closeMenu()">CLOSE ✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const fresh={level:1,xp:0,cash:100,strength:5,defense:5,speed:5,intelligence:5,endurance:5,health:100,hunger:100,wood:0,stone:0,scrap:0,food:0,reputation:0,kills:0};
let S={...fresh};try{let d=JSON.parse(localStorage.getItem('outlaw_save')||'null');if(d)S={...fresh,...d}}catch(e){}
let scene,camera,renderer,player,clock,enemyList=[],nodes=[],yaw=0,pitch=.18,vy=0,onGround=true,joy={x:0,y:0},camTouch=null,lastTouchX=0,lastTouchY=0,noticeTimer=0,modalType='';
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.88})}
function box(name,x,y,z,sx,sy,sz,color){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.name=name;scene.add(m);return m}
function sphere(x,y,z,r,color){let m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat(color));m.position.set(x,y,z);scene.add(m);return m}
function init(){
if(!window.THREE){$('statlines').textContent='3D engine could not load. Check internet and reopen this file in Safari.';return}
scene=new THREE.Scene();scene.background=new THREE.Color(0x9eaf9b);scene.fog=new THREE.Fog(0x9eaf9b,35,110);
camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
renderer=new THREE.WebGLRenderer({antialias:false,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f0dc,0x34402e,2));let sun=new THREE.DirectionalLight(0xffe5bd,2.2);sun.position.set(-20,35,15);scene.add(sun);
box('island',0,-.5,0,180,1,180,0x526a49);
// Paths and clearing
box('trail',0,.015,0,9,.03,120,0x8a805f);
for(let i=0;i<110;i++){let x=(Math.random()-.5)*145,z=(Math.random()-.5)*145;if(Math.abs(x)<8)continue;let h=1.3+Math.random()*1.2;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,h,6),mat(0x493524));trunk.position.set(x,h/2,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.4+Math.random(),3+Math.random()*2,7),mat(Math.random()>.5?0x2e5032:0x3b5b35));crown.position.set(x,h+1.5,z);scene.add(crown)}
for(let i=0;i<18;i++){let x=(Math.random()-.5)*90,z=(Math.random()-.5)*90;if(Math.abs(x)<10&&Math.abs(z)<10)continue;let r=.5+Math.random()*1.2;sphere(x,r*.6,z,r,0x666c65)}
// player body
player=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x344b4c));body.position.y=1.05;player.add(body);let head=sphere(0,1.85,0,.28,0xb58b69);player.add(head);let pack=box('pack',0,1.1,-.37,.48,.58,.22,0x544a32);player.add(pack);player.position.set(0,0,0);scene.add(player);
// resource nodes
const specs=[['WOOD CACHE',5,3,'wood',0x987047],['STONE DEPOSIT',-5,2,'stone',0x929a98],['SCRAP PILE',7,-5,'scrap',0x647a7b],['FOOD CRATE',-7,-4,'food',0xb6a05b],['WOOD CACHE',-11,10,'wood',0x987047],['SCRAP PILE',13,8,'scrap',0x647a7b],['FOOD CRATE',4,15,'food',0xb6a05b]];
specs.forEach((a,i)=>{let m=box(a[0],a[1],.55,a[2],1.2,1.1,1.2,a[4]);m.userData={kind:'resource',resource:a[3],label:a[0],taken:false};nodes.push(m)});
let board=box('JOB BOARD',0,1,8,1.8,2,.35,0x70442a);board.userData={kind:'job',label:'JOB BOARD'};nodes.push(board);
for(let i=0;i<4;i++){let e=new THREE.Group();let b=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x792e29));b.position.y=1; e.add(b);let h=sphere(0,1.8,0,.26,0x99735c);e.add(h);e.position.set(12+i*3,0,11+i*4);e.userData={hp:60,attack:0};scene.add(e);enemyList.push(e)}
clock=new THREE.Clock();window.addEventListener('resize',resize);animate();refresh();
}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04);
let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
let move=forward.multiplyScalar(joy.y).add(right.multiplyScalar(joy.x));if(move.length()>1)move.normalize();
player.position.addScaledVector(move,(4.1+S.speed*.06)*dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-82,82);player.position.z=THREE.MathUtils.clamp(player.position.z,-82,82);
if(move.lengthSq()>.01)player.rotation.y=Math.atan2(move.x,move.z);
if(!onGround){vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}}
let cp=Math.cos(pitch),sp=Math.sin(pitch);let target=player.position.clone().add(new THREE.Vector3(0,1.35,0));let offset=new THREE.Vector3(Math.sin(yaw)*cp,sp,Math.cos(yaw)*cp).multiplyScalar(6.5);camera.position.copy(target.add(offset));camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.2,0)));
enemyList.forEach(e=>{if(!e.parent)return;let dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);if(d<12&&d>1.6){e.position.x+=dx/d*1.35*dt;e.position.z+=dz/d*1.35*dt;e.rotation.y=Math.atan2(dx,dz)}e.userData.attack-=dt;if(d<1.8&&e.userData.attack<=0){S.health=Math.max(0,S.health-(8-Math.floor(S.defense/4)));e.userData.attack=1.7;if(S.health===0){S.health=50;S.cash=Math.max(0,S.cash-20);player.position.set(0,0,0);toast('You woke up at your safehouse. $20 lost.');refresh()}}});
renderer.render(scene,camera);
}
function refresh(){let xpNeed=S.level*100;$('statlines').innerHTML=`LV ${S.level} · XP ${S.xp}/${xpNeed}<div class="bar"><div class="fill" style="width:${S.health}%"></div></div>HP ${S.health}/100 · Hunger ${S.hunger}/100<br><b>$${S.cash}</b> · REP ${S.reputation}<br>STR ${S.strength} · DEF ${S.defense} · SPD ${S.speed}<br>INT ${S.intelligence} · END ${S.endurance}<br>Wood ${S.wood} · Stone ${S.stone} · Scrap ${S.scrap} · Food ${S.food}<br>Kills ${S.kills}`;if(modalType)openMenu(modalType)}
function xp(n){S.xp+=n;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.health=100;toast('LEVEL UP! You reached level '+S.level)}}
function toast(t){let el=$('notice');el.textContent=t;el.style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.style.display='none',2300)}
function nearest(){let best=null,dist=4;nodes.forEach(n=>{if(n.userData.taken)return;let d=n.position.distanceTo(player.position);if(d<dist){best=n;dist=d}});return best}
window.interact=function(){let n=nearest();if(!n){toast('Nothing nearby. Explore the island.');return}if(n.userData.kind==='job'){let reward=30+S.intelligence*2;S.cash+=reward;S.reputation+=2;xp(20);toast('Job completed: +$'+reward+', +20 XP, +2 REP')}else{S[n.userData.resource]++;xp(5);n.userData.taken=true;n.visible=false;toast('Collected 1 '+n.userData.resource)}refresh()}
window.attack=function(){let nearestEnemy=null,distance=3.3;enemyList.forEach(e=>{if(!e.parent)return;let d=e.position.distanceTo(player.position);if(d<distance){distance=d;nearestEnemy=e}});if(!nearestEnemy){toast('No raider in range.');return}nearestEnemy.userData.hp-=25+S.strength*2;toast('Hit raider! '+Math.max(0,nearestEnemy.userData.hp)+' HP left');if(nearestEnemy.userData.hp<=0){scene.remove(nearestEnemy);S.kills++;S.cash+=15;S.reputation++;xp(25);toast('Raider defeated: +$15, +25 XP')}refresh()}
window.jump=function(){if(onGround){vy=6.7;onGround=false}}
window.eat=function(){if(S.food<1){toast('No food. Find a food crate.');return}S.food--;S.hunger=Math.min(100,S.hunger+25);S.health=Math.min(100,S.health+10);toast('You ate food. Hunger and health restored.');refresh()}
window.saveGame=function(){try{localStorage.setItem('outlaw_save',JSON.stringify(S));toast('Progress saved on this device.')}catch(e){toast('Save unavailable in this browser session.')}}
window.openMenu=function(type){modalType=type;$('modalTitle').textContent=type;let body='';
if(type==='Character')body=`<div class="row"><span>Level / XP</span><b>${S.level} / ${S.xp}</b></div><div class="row"><span>Cash</span><b>$${S.cash}</b></div><div class="row"><span>Reputation</span><b>${S.reputation}</b></div>${['strength','defense','speed','intelligence','endurance'].map(k=>`<div class="row"><span>${k.toUpperCase()}</span><b>${S[k]}</b></div>`).join('')}<div class="actions"><button onclick="train('strength')">Train STR ($25)</button><button onclick="train('defense')">Train DEF ($25)</button><button onclick="train('speed')">Train SPD ($25)</button><button onclick="train('intelligence')">Train INT ($25)</button><button onclick="train('endurance')">Train END ($25)</button></div>`;
else if(type==='Inventory')body=`<div class="row"><span>Wood</span><b>${S.wood}</b></div><div class="row"><span>Stone</span><b>${S.stone}</b></div><div class="row"><span>Scrap</span><b>${S.scrap}</b></div><div class="row"><span>Food</span><b>${S.food}</b></div><p class="muted">Gather supplies from crates and deposits across the island. Crafting and equipment are planned for the next milestone.</p>`;
else body=`<p>Visit the wooden JOB BOARD near your starting point and tap GATHER / USE.</p><div class="row"><span>Quick delivery job</span><b>$${30+S.intelligence*2} + XP</b></div><p>Training costs $25 and increases one stat by 1. Intelligence increases job rewards.</p><div class="actions"><button onclick="completeJob()">Quick Job</button><button onclick="train('strength')">Train Strength ($25)</button><button onclick="train('intelligence')">Train Intelligence ($25)</button></div>`;
$('modalBody').innerHTML=body;$('modal').style.display='block'}
window.closeMenu=function(){modalType='';$('modal').style.display='none'}
window.train=function(k){if(S.cash<25){toast('You need $25 to train.');return}S.cash-=25;S[k]++;xp(10);toast(k.toUpperCase()+' increased!');refresh()}
window.completeJob=function(){S.cash+=30+S.intelligence*2;S.reputation+=2;xp(20);refresh();toast('Job completed!')}
const stick=$('stick'),knob=$('knob');let activeStick=null;
function setStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=(e.clientX-cx)/(r.width*.38),dy=(e.clientY-cy)/(r.height*.38),l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=-dy;knob.style.transform=`translate(${dx*38}px,${-dy*38}px)`}
stick.addEventListener('pointerdown',e=>{activeStick=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(activeStick===e.pointerId)setStick(e)});function release(e){if(activeStick===e.pointerId){activeStick=null;joy={x:0,y:0};knob.style.transform='translate(0,0)'}}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
$('game').addEventListener('pointerdown',e=>{if(e.clientX<170&&e.clientY>innerHeight-200)return;camTouch=e.pointerId;lastTouchX=e.clientX;lastTouchY=e.clientY});$('game').addEventListener('pointermove',e=>{if(camTouch!==e.pointerId)return;let dx=e.clientX-lastTouchX,dy=e.clientY-lastTouchY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.2,.65);lastTouchX=e.clientX;lastTouchY=e.clientY});$('game').addEventListener('pointerup',e=>{if(camTouch===e.pointerId)camTouch=null});$('game').addEventListener('pointercancel',()=>camTouch=null);
window.addEventListener('keydown',e=>{if(e.key==='e')interact();if(e.key===' ')jump();if(e.key==='j')completeJob();if(e.key==='Escape')closeMenu()});
init();
